# Builds freki for macOS (universal .app in a .dmg), Windows (.zip) and Linux (.tar.gz).
# A pushed version tag (v0.1.0, …) tests, builds and creates a draft GitHub release with
# them and their checksums (publish it on the releases page after checking); run by hand
# (Actions → Release → Run workflow), it only builds and keeps them as artifacts.
#
# Crates and build output are cached per OS, toolchain and Cargo.lock. A tag's run can use
# the cache of master (not of other tags), so a manual run on master warms it up.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same tag or branch cancels the older one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # A dated nightly at least two weeks old (freki needs nightly Rust).
  TOOLCHAIN: nightly-2026-11-08
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # The oldest supported Ubuntu, so the binary runs with older glibc versions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ env.TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.TOOLCHAIN }}-
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libclang-dev
      - name: Install Rust
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      # Unit tests and the built-in checks (the test-ROM suites skip without their ROMs);
      # a failure stops the release. Built with the release profile, so the build below
      # reuses the dependencies.
      - name: Test
        run: cargo +"$TOOLCHAIN" test --release --locked --workspace
      - name: Build
        run: cargo +"$TOOLCHAIN" build --release --locked -p freki
      - name: Package
        run: |
          name="freki-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/freki README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux
          path: freki-*-linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ env.TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.TOOLCHAIN }}-
      - name: Install Rust
        run: rustup toolchain install "$env:TOOLCHAIN" --profile minimal
      - name: Build
        run: cargo "+$env:TOOLCHAIN" build --release --locked -p freki
      - name: Package
        run: |
          $name = "freki-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/freki.exe, README.md, LICENSE $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows
          path: freki-*-windows-x86_64.zip

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ env.TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.TOOLCHAIN }}-
      - name: Install Rust
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Build (Apple Silicon and Intel, in parallel)
        run: |
          cargo +"$TOOLCHAIN" build --release --locked -p freki \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
      - name: Make freki.app
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in [0-9]*) ;; *) version="0.0.0" ;; esac
          app="freki.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          lipo -create -output "$app/MacOS/freki" \
            target/aarch64-apple-darwin/release/freki target/x86_64-apple-darwin/release/freki
          cat > "$app/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>freki</string>
            <key>CFBundleDisplayName</key><string>freki</string>
            <key>CFBundleIdentifier</key><string>io.github.engrin.freki</string>
            <key>CFBundleExecutable</key><string>freki</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSApplicationCategoryType</key><string>public.app-category.games</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSCameraUsageDescription</key><string>freki can use a camera as the Game Boy Camera's sensor.</string>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Info.plist"
          # Not notarized (no Apple Developer account): signed ad hoc only.
          codesign --force --deep --sign - freki.app
      - name: Make the disk image
        run: |
          name="freki-${GITHUB_REF_NAME}-macos-universal"
          mkdir dmg
          cp -R freki.app README.md LICENSE dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname freki -srcfolder dmg -format UDZO -ov "$name.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos
          path: freki-*-macos-universal.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the release (as a draft, to check before publishing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Downloads:
          - **macOS** (Apple Silicon and Intel, macOS 11 or later): open the `.dmg` and drag
            freki to Applications. It is not notarized: on first start macOS refuses to open
            it; then choose **System Settings → Privacy & Security → Open Anyway** (or run
            `xattr -dr com.apple.quarantine /Applications/freki.app`).
          - **Windows** (64-bit): unzip and run `freki.exe`. SmartScreen may warn about an
            unknown publisher: **More info → Run anyway**.
          - **Linux** (x86-64): unpack and run `./freki`. Needs ALSA and X11 or Wayland.

          `SHA256SUMS` lists the files' checksums (`sha256sum -c SHA256SUMS`).

          freki comes without games or boot ROMs.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --repo "$GITHUB_REPOSITORY" --title "freki $GITHUB_REF_NAME" --notes-file notes.md
