# Builds freki for Linux (.tar.gz, .deb, .rpm, AppImage), Windows (.zip) and macOS
# (universal .app in a .dmg) with `cargo xtask dist` (xtask/src/main.rs) on each OS.
# A pushed version tag (v0.1.0, …) tests, builds and creates a draft GitHub release with
# them and their checksums (publish it on the releases page after checking); run by hand
# (Actions → Release → Run workflow), it only builds and keeps them as artifacts.
#
# Crates and build output are cached per OS, toolchain and Cargo.lock. A tag's run can use
# the cache of master (not of other tags), so a manual run on master warms it up.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same tag or branch cancels the older one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  # A dated nightly at least two weeks old (freki needs nightly Rust).
  TOOLCHAIN: nightly-2026-11-08
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # The oldest supported Ubuntu, so the binary runs with older glibc versions too.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ env.TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.TOOLCHAIN }}-
      - name: Install build and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev libudev-dev libclang-dev rpm
      # Pinned releases, checked against their SHA-256 (not the "continuous" builds).
      - name: Download appimagetool and the AppImage runtime
        run: |
          mkdir ~/appimage && cd ~/appimage
          curl -fsSLo appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          curl -fsSLo runtime https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-x86_64
          sha256sum -c <<EOF
          ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
          2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d  runtime
          EOF
          chmod +x appimagetool
          echo "APPIMAGETOOL=$HOME/appimage/appimagetool" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME=$HOME/appimage/runtime" >> "$GITHUB_ENV"
      - name: Install Rust
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      # Unit tests and the built-in checks (the test-ROM suites skip without their ROMs);
      # a failure stops the release. Built with the release profile, so the packaging
      # build reuses the dependencies.
      - name: Test
        run: cargo +"$TOOLCHAIN" test --release --locked --workspace
      - name: Build and package
        run: cargo +"$TOOLCHAIN" xtask dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ env.TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.TOOLCHAIN }}-
      - name: Install Rust
        run: rustup toolchain install "$env:TOOLCHAIN" --profile minimal
      - name: Build and package
        run: cargo "+$env:TOOLCHAIN" xtask dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ env.TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ env.TOOLCHAIN }}-
      - name: Install Rust
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
      # uv runs xtask/dmg.py (dmgbuild), which lays out the disk image's window. A pinned
      # release, checked against its SHA-256.
      - name: Install uv
        run: |
          mkdir ~/uv && cd ~/uv
          curl -fsSLo uv.tar.gz https://github.com/astral-sh/uv/releases/download/0.13.6/uv-aarch64-apple-darwin.tar.gz
          echo "60fbd5c8a1ed681845eea28d9d622fcde03c51e91a43465b64a1e17db1ed3472  uv.tar.gz" | shasum -a 256 -c
          tar xzf uv.tar.gz --strip-components 1
          echo "$HOME/uv" >> "$GITHUB_PATH"
      - name: Build and package
        run: cargo +"$TOOLCHAIN" xtask dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the release (as a draft, to check before publishing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Downloads:
          - **macOS** (Apple Silicon and Intel, macOS 11 or later): open the `.dmg` and drag
            freki to Applications. It is not notarized: on first start macOS refuses to open
            it; then choose **System Settings → Privacy & Security → Open Anyway** (or run
            `xattr -dr com.apple.quarantine /Applications/freki.app`).
          - **Windows** (64-bit): unzip and run `freki.exe`. SmartScreen may warn about an
            unknown publisher: **More info → Run anyway**.
          - **Linux** (x86-64; needs ALSA and X11 or Wayland):
            - Debian, Ubuntu, Mint: `sudo apt install ./freki-…-linux-x86_64.deb`
            - Fedora, openSUSE: `sudo dnf install ./freki-…-linux-x86_64.rpm` (or `zypper install`)
            - any distribution: the `.AppImage` (`chmod +x` it and run it), or the `.tar.gz`
              with the bare `freki` binary.

          `SHA256SUMS` lists the files' checksums (`sha256sum -c SHA256SUMS`).

          freki comes without games or boot ROMs.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --repo "$GITHUB_REPOSITORY" --title "freki $GITHUB_REF_NAME" --notes-file notes.md
