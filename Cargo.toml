[workspace]
resolver = "3"
members = ["crates/freki-core", "crates/freki"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/engrin/gameboy-emu"
authors = ["engrin"]

[profile.release]
lto = "thin"
codegen-units = 1

# The emulator is unplayably slow without optimisations; keep debug builds fast-ish.
[profile.dev]
opt-level = 1
